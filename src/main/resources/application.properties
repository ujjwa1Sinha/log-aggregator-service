spring.application.name=Log-Aggregator
server.port=8080
server.address=0.0.0.0
spring.main.allow-bean-definition-overriding=true

# ----- MongoDB -----
spring.data.mongodb.uri=${MONGO_URI:mongodb://localhost:27017/logs}

# ----- Redis -----
spring.redis.host=${REDIS_HOST:localhost}
spring.redis.port=${REDIS_PORT:6379}
spring.redis.password=${REDIS_PASSWORD:}
spring.redis.ssl=${REDIS_SSL:false}

# Kafka
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=${KAFKA_GROUP_ID:log-group}
spring.kafka.consumer.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false


# Elasticsearch
spring.elasticsearch.uris=${ELASTICSEARCH_URIS:http://localhost:9200}
spring.elasticsearch.username=${ELASTICSEARCH_USERNAME:}
spring.elasticsearch.password=${ELASTICSEARCH_PASSWORD:}
spring.elasticsearch.connection-timeout=5s
spring.elasticsearch.socket-timeout=30s


# ==================== Resilience4j Configuration ====================

# Circuit Breaker for MongoDB
resilience4j.circuitbreaker.instances.mongoCB.registerHealthIndicator=true
resilience4j.circuitbreaker.instances.mongoCB.slidingWindowSize=10
resilience4j.circuitbreaker.instances.mongoCB.failureRateThreshold=50
resilience4j.circuitbreaker.instances.mongoCB.waitDurationInOpenState=10s
resilience4j.circuitbreaker.instances.mongoCB.automaticTransitionFromOpenToHalfOpenEnabled=true
resilience4j.circuitbreaker.instances.mongoCB.permittedNumberOfCallsInHalfOpenState=3

# Circuit Breaker for Elasticsearch
resilience4j.circuitbreaker.instances.elasticsearchCB.registerHealthIndicator=true
resilience4j.circuitbreaker.instances.elasticsearchCB.slidingWindowSize=10
resilience4j.circuitbreaker.instances.elasticsearchCB.failureRateThreshold=50
resilience4j.circuitbreaker.instances.elasticsearchCB.waitDurationInOpenState=15s
resilience4j.circuitbreaker.instances.elasticsearchCB.automaticTransitionFromOpenToHalfOpenEnabled=true
resilience4j.circuitbreaker.instances.elasticsearchCB.permittedNumberOfCallsInHalfOpenState=3

# Circuit Breaker for Kafka Consumer
resilience4j.circuitbreaker.instances.kafkaConsumerCB.registerHealthIndicator=true
resilience4j.circuitbreaker.instances.kafkaConsumerCB.slidingWindowSize=10
resilience4j.circuitbreaker.instances.kafkaConsumerCB.failureRateThreshold=60
resilience4j.circuitbreaker.instances.kafkaConsumerCB.waitDurationInOpenState=20s
resilience4j.circuitbreaker.instances.kafkaConsumerCB.automaticTransitionFromOpenToHalfOpenEnabled=true

# Circuit Breaker for Log Persistence
resilience4j.circuitbreaker.instances.logPersistenceCB.registerHealthIndicator=true
resilience4j.circuitbreaker.instances.logPersistenceCB.slidingWindowSize=10
resilience4j.circuitbreaker.instances.logPersistenceCB.failureRateThreshold=50
resilience4j.circuitbreaker.instances.logPersistenceCB.waitDurationInOpenState=10s
resilience4j.circuitbreaker.instances.logPersistenceCB.automaticTransitionFromOpenToHalfOpenEnabled=true

# Rate Limiter for Search Operations
resilience4j.ratelimiter.instances.searchRateLimiter.limitForPeriod=100
resilience4j.ratelimiter.instances.searchRateLimiter.limitRefreshPeriod=1s
resilience4j.ratelimiter.instances.searchRateLimiter.timeoutDuration=500ms

# Bulkhead for Search Operations
resilience4j.bulkhead.instances.searchBulkhead.maxConcurrentCalls=25
resilience4j.bulkhead.instances.searchBulkhead.maxWaitDuration=500ms

# Bulkhead for Log Persistence
resilience4j.bulkhead.instances.logPersistenceBulkhead.maxConcurrentCalls=50
resilience4j.bulkhead.instances.logPersistenceBulkhead.maxWaitDuration=1s

# Retry Configuration
spring.kafka.listener.concurrency=3
spring.kafka.listener.ack-mode=manual

# DLT (Dead Letter Topic)
spring.kafka.consumer.properties.spring.kafka.consumer.retry.backoff.ms=2000
spring.kafka.consumer.properties.max.poll.interval.ms=60000
spring.kafka.consumer.properties.spring.kafka.listener.default-error-handler=false

# Async Configuration
spring.task.execution.pool.core-size=10
spring.task.execution.pool.max-size=20
spring.task.execution.pool.queue-capacity=100

